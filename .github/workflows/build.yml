name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Cancel in-progress runs on the same ref so a fresh push supersedes the old
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (aarch64, Debian Trixie)
    runs-on: ubuntu-24.04-arm
    # Run inside Debian Trixie so libcamera ABI matches the Pi target exactly
    container:
      image: debian:trixie-slim

    steps:
      - name: Install base build deps + add Raspberry Pi apt repo
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates pkg-config build-essential \
            libjpeg62-turbo-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            cmake ninja-build

          # The Pi uses RPi's libcamera fork (libcamera0.7+rpt*), which has
          # the newer control IDs (AnalogueGainMode, ExposureTimeMode) that
          # camera_ffi.cpp depends on. Stock Trixie's libcamera lacks them.
          #
          # `trusted=yes` skips signature verification for this repo. Trixie's
          # sqv rejects the RPi keyring's SHA1 binding signatures (per the
          # Feb-2026 deprecation policy), and the RPi project hasn't re-signed
          # with SHA2 yet. The repo is HTTPS so transport is still authenticated;
          # we're only skipping the OpenPGP check on the metadata.
          echo "deb [trusted=yes] https://archive.raspberrypi.com/debian trixie main" \
            > /etc/apt/sources.list.d/raspi.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcamera-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-trixie

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked
